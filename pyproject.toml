[project]
name = "alorair-home-assistant"
version = "0.3.0"
license = "MIT"
requires-python = ">=3.14.2"
dependencies = [
    "aiohttp==3.14.3",
    "cryptography==48.0.0",
    "homeassistant==2026.6.2",
]

[dependency-groups]
dev = [
    "aiooui==0.1.7",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
