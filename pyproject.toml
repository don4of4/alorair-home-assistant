[project]
name = "alorair-home-assistant"
version = "0.4.0"
license = "MIT"
requires-python = ">=3.14.2"
dependencies = [
    "aiohttp==3.14.3",
    "cryptography==50.0.0",
    "homeassistant==2026.7.0",
]

[dependency-groups]
dev = [
    "aiooui==0.1.7",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
]

[tool.uv]
# Keep the tested HA baseline while retaining the security updates in PRs #2–#5
# and #14. pyOpenSSL 26.4.0 supports cryptography 50 without relaxing its bounds.
# Revisit these overrides when updating the Home Assistant test baseline.
override-dependencies = [
    "aiohttp==3.14.3",
    "cryptography==50.0.0",
    "pillow==12.3.0",
    "pyjwt==2.13.0",
    "pyopenssl==26.4.0",
    "uv==0.13.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
